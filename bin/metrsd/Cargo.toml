[package]
name = "metrsd"
version = "0.6.0"
edition = "2021"
rust-version = "1.97"
authors = ["nanocl contributors <team@next-hat.com>"]
description = "The Metrs daemon"
license = "MIT OR Apache-2.0"
readme = "../../readme.md"
repository = "https://github.com/next-hat/metrs"

[[bin]]
name = "metrsd"
test = true
bench = false
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
futures = "0.3.34"
log = "0.4.34"
ntex = { version = "4.2.0", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
tokio = { version = "1.53.2", features = ["sync"] }
metrs_stubs = { version = "0.6", path = "../../crates/metrs_stubs", features = [
  "serde",
  "sysinfo",
  "bytes",
] }
